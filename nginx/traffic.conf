# 只发送到本机共享卷上的统计 socket。未记录地址、路径、查询参数或 Cookie。
map $host $stacknest_count_traffic {
    default 0;
    "~^stack-nest-(?:-app-)?[a-z0-9][a-z0-9-]*\." 1;
}
map "$request_method:$http_sec_fetch_dest:$status:$sent_http_content_type" $stacknest_page_request {
    default 0;
    "~^GET:(document|iframe):" 1;
    "~*^GET::[23][0-9][0-9]:text/html" 1;
}
log_format stacknest_counts 'sn1 $msec $host $status $stacknest_page_request';
access_log syslog:server=unix:/data/traffic.sock,tag=stacknest,nohostname stacknest_counts if=$stacknest_count_traffic;
