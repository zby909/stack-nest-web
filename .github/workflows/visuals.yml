name: Visual previews

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Check Chinese font support
        run: |
          if [ -z "$(fc-list :lang=zh-cn family)" ]; then
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          test -n "$(fc-list :lang=zh-cn family)"
      - name: Render and check a fresh gallery
        run: |
          pnpm screenshots
          mv node_modules/.tmp/visual-results/gallery "$RUNNER_TEMP/stacknest-visuals"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stacknest-visuals
          path: ${{ runner.temp }}/stacknest-visuals/
          if-no-files-found: error
          retention-days: 7

  sync:
    needs: render
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stacknest-visuals
          path: ${{ runner.temp }}/stacknest-visuals
      - name: Update changed screenshots
        shell: bash
        run: |
          set -euo pipefail
          # 分支已前进时由新提交的任务同步，避免旧图覆盖新界面。
          main_head() { git ls-remote --exit-code origin refs/heads/main | cut -f1; }
          remote_head=$(main_head)
          [[ "$remote_head" == "$GITHUB_SHA" ]] || exit 0
          rsync -a --delete --include='*-desktop.png' --include='*-mobile.png' --exclude='*' "$RUNNER_TEMP/stacknest-visuals/docs/images/" docs/images/
          git add -- 'docs/images/*-desktop.png' 'docs/images/*-mobile.png'
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh visual previews'
          if ! git push origin HEAD:refs/heads/main; then
            remote_head=$(main_head)
            [[ "$remote_head" != "$GITHUB_SHA" ]] || exit 1
          fi
