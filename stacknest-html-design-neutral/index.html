<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>界面预览 · StackNest</title>
    <link rel="icon" href="../public/stacknest.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../public/stacknest.svg" alt="" width="40" height="40" /><span>StackNest</span>
      </div>
      <h1>界面预览</h1>
    </header>
    <main>
      <aside>
        <nav aria-label="预览页面">
          <a
            href="../docs/images/projects-desktop.png"
            data-screen="projects-desktop"
            data-route="/projects"
            aria-current="true"
            >静态项目</a
          >
          <a
            href="../docs/images/versions-desktop.png"
            data-screen="versions-desktop"
            data-route="/projects/portfolio/versions"
            >待发布版本</a
          >
          <a
            href="../docs/images/docker-desktop.png"
            data-screen="docker-desktop"
            data-route="/apps"
            >Docker 应用</a
          >
          <a
            href="../docs/images/app-detail-desktop.png"
            data-screen="app-detail-desktop"
            data-route="/apps/0c2d84bb-15a1-492b-938a-83282600c112"
            >应用详情</a
          >
          <a
            href="../docs/images/activity-desktop.png"
            data-screen="activity-desktop"
            data-route="/activity"
            >操作日志</a
          >
          <a href="../docs/images/users-desktop.png" data-screen="users-desktop" data-route="/users"
            >用户邮箱</a
          >
          <a
            href="../docs/images/network-desktop.png"
            data-screen="network-desktop"
            data-route="/network"
            >网络设置</a
          >
          <a
            href="../docs/images/system-desktop.png"
            data-screen="system-desktop"
            data-route="/system"
            >服务器状态 · 深色</a
          >
          <a
            href="../docs/images/projects-mobile.png"
            data-screen="projects-mobile"
            data-route="/projects"
            >手机 · 项目</a
          >
          <a
            href="../docs/images/login-mobile.png"
            data-screen="login-mobile"
            data-route="/__visual/login"
            >手机 · 登录</a
          >
        </nav>
        <p>在 <code>web/</code> 运行 <code>pnpm design</code>，即可进入交互预览。</p>
      </aside>
      <section aria-labelledby="screen-title">
        <div class="toolbar">
          <h2 id="screen-title" aria-live="polite">静态项目</h2>
          <div>
            <a
              id="original"
              href="../docs/images/projects-desktop.png"
              target="_blank"
              rel="noopener"
              >查看原图</a
            >
            <a id="live" href="http://127.0.0.1:4176/projects" target="_blank" rel="noopener"
              >交互预览 ↗</a
            >
          </div>
        </div>
        <figure>
          <img id="screen" src="../docs/images/projects-desktop.png" alt="StackNest 静态项目页面" />
        </figure>
      </section>
    </main>
  </body>
</html>
